<style>body{margin:0;padding:16px;background:var(--bg1);font-family:var(--font-body);color:var(--fg2)}.g{display:grid;gap:10px}.sw{border-radius:var(--r-md);padding:10px;min-height:72px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px;line-height:1.3}.sw b{font-size:12px;font-weight:700}.sw code{font-family:var(--font-mono);font-size:10.5px;opacity:.85}.mono{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}.cap{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}</style></head><body><div style="background:var(--hkust-blue);border-radius:8px;padding:18px 22px;display:flex;align-items:center;gap:22px;font-size:12px"><span style="color:#fff;font-weight:700">Text #fff</span><span style="color:var(--on-navy-muted)">Muted #aebfd4</span><span style="color:var(--on-navy-icon)">Icon #cdd8e6</span><span style="border-left:1px solid var(--on-navy-border);padding-left:16px;color:#fff">Border 35% white</span><span style="border-left:1px solid var(--on-navy-divider);padding-left:16px;color:#fff">Divider 25% white</span><span style="background:var(--on-navy-hover);padding:6px 10px;border-radius:4px;color:#fff">Hover 10% white</span><span style="color:var(--hkust-yellow);font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:11px">Eyebrow · yellow</span></div></body></html>
