<!-- @dsCard group="Colors" viewport="700x110" name="Text colours" subtitle="Four-step foreground ramp; navy doubles as heading colour" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Text colours</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg1);font-family:var(--font-body);color:var(--fg2)}.g{display:grid;gap:10px}.sw{border-radius:var(--r-md);padding:10px;min-height:72px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px;line-height:1.3}.sw b{font-size:12px;font-weight:700}.sw code{font-family:var(--font-mono);font-size:10.5px;opacity:.85}.mono{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}.cap{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}</style></head><body><div class="g" style="grid-template-columns:repeat(5,1fr)"><div class="sw" style="background:var(--fg1);color:#fff;"><b>Heading</b><code>#003366 · --fg1</code></div><div class="sw" style="background:var(--fg2);color:#fff;"><b>Body</b><code>#1f2a44 · --fg2</code></div><div class="sw" style="background:var(--fg3);color:#fff;"><b>Muted</b><code>#5a6478 · --fg3</code></div><div class="sw" style="background:var(--fg4);color:#fff;"><b>Subtle</b><code>#8c8f90 · --fg4</code></div><div class="sw" style="background:var(--hkust-blue);color:var(--on-navy-muted);"><b>On navy · muted</b><code>#aebfd4 · --on-navy-muted</code></div></div></body></html>
