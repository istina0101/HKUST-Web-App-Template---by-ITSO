<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4px grid for layout gaps and margins" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Spacing scale</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg1);font-family:var(--font-body);color:var(--fg2)}.g{display:grid;gap:10px}.sw{border-radius:var(--r-md);padding:10px;min-height:72px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px;line-height:1.3}.sw b{font-size:12px;font-weight:700}.sw code{font-family:var(--font-mono);font-size:10.5px;opacity:.85}.mono{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}.cap{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}</style></head><body><div class="g" style="gap:6px"><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:90px">--sp-1 · 4px</span><span style="height:10px;width:16px;background:var(--itso-blue-dark);border-radius:2px"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:90px">--sp-2 · 8px</span><span style="height:10px;width:32px;background:var(--itso-blue-dark);border-radius:2px"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:90px">--sp-3 · 12px</span><span style="height:10px;width:48px;background:var(--itso-blue-dark);border-radius:2px"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:90px">--sp-4 · 16px</span><span style="height:10px;width:64px;background:var(--itso-blue-dark);border-radius:2px"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:90px">--sp-5 · 20px</span><span style="height:10px;width:80px;background:var(--itso-blue-dark);border-radius:2px"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:90px">--sp-6 · 24px</span><span style="height:10px;width:96px;background:var(--itso-blue-dark);border-radius:2px"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:90px">--sp-8 · 32px</span><span style="height:10px;width:128px;background:var(--itso-blue-dark);border-radius:2px"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:90px">--sp-10 · 40px</span><span style="height:10px;width:160px;background:var(--itso-blue-dark);border-radius:2px"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:90px">--sp-12 · 48px</span><span style="height:10px;width:192px;background:var(--itso-blue-dark);border-radius:2px"></span></div><div style="display:flex;align-items:center;gap:12px"><span class="mono" style="width:90px">--sp-16 · 64px</span><span style="height:10px;width:256px;background:var(--itso-blue-dark);border-radius:2px"></span></div></div></body></html>
