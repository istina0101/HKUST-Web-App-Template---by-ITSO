<!-- @dsCard group="Colors" viewport="700x110" name="Status colours" subtitle="Base semantic colours for icons, dots and solid buttons" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Status colours</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg1);font-family:var(--font-body);color:var(--fg2)}.g{display:grid;gap:10px}.sw{border-radius:var(--r-md);padding:10px;min-height:72px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px;line-height:1.3}.sw b{font-size:12px;font-weight:700}.sw code{font-family:var(--font-mono);font-size:10.5px;opacity:.85}.mono{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}.cap{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}</style></head><body><div class="g" style="grid-template-columns:repeat(4,1fr)"><div class="sw" style="background:var(--success);color:#fff;"><b>Success</b><code>#009a61 · --success</code></div><div class="sw" style="background:var(--warning);color:#003366;"><b>Warning</b><code>#faa61a · --warning</code></div><div class="sw" style="background:var(--danger);color:#fff;"><b>Danger</b><code>#ed1b2f · --danger</code></div><div class="sw" style="background:var(--info);color:#fff;"><b>Info</b><code>#0074bc · --info</code></div></div></body></html>
