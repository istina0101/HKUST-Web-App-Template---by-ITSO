<!-- @dsCard group="Colors" viewport="700x110" name="Surfaces & borders" subtitle="Page, card, sunken and brand surfaces with the two border greys" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Surfaces & borders</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg1);font-family:var(--font-body);color:var(--fg2)}.g{display:grid;gap:10px}.sw{border-radius:var(--r-md);padding:10px;min-height:72px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px;line-height:1.3}.sw b{font-size:12px;font-weight:700}.sw code{font-family:var(--font-mono);font-size:10.5px;opacity:.85}.mono{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}.cap{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}</style></head><body><div class="g" style="grid-template-columns:repeat(7,1fr)"><div class="sw" style="background:var(--bg1);color:var(--fg2);border:1px solid var(--border);"><b>Card</b><code>#ffffff · --bg1</code></div><div class="sw" style="background:var(--bg2);color:var(--fg2);border:1px solid var(--border);"><b>Page</b><code>#f6f8fb · --bg2</code></div><div class="sw" style="background:var(--bg3);color:var(--fg2);border:1px solid var(--border);"><b>Sunken</b><code>#ebf0f5 · --bg3</code></div><div class="sw" style="background:var(--bg-brand-light);color:var(--fg1);"><b>Brand light</b><code>#e6ecf3 · --bg-brand-light</code></div><div class="sw" style="background:var(--bg-brand);color:#fff;"><b>Brand</b><code>#003366 · --bg-brand</code></div><div class="sw" style="background:var(--border);color:var(--fg2);"><b>Border</b><code>#d8dee8 · --border</code></div><div class="sw" style="background:var(--border-strong);color:#fff;"><b>Border strong</b><code>#9aa6b8 · --border-strong</code></div></div></body></html>
