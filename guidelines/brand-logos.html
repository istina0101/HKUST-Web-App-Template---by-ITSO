<!-- @dsCard group="Brand" viewport="700x200" name="Logos" subtitle="Four supplied files: full-name and mark, colour on white and white on navy" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Logos</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg1);font-family:var(--font-body);color:var(--fg2)}.g{display:grid;gap:10px}.sw{border-radius:var(--r-md);padding:10px;min-height:72px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px;line-height:1.3}.sw b{font-size:12px;font-weight:700}.sw code{font-family:var(--font-mono);font-size:10.5px;opacity:.85}.mono{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}.cap{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}</style></head><body><div class="g" style="grid-template-columns:1fr 1fr;gap:12px">
<div style="border:1px solid var(--border);border-radius:8px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:18px"><img src="../assets/logo/hkust-fullname-color.png" style="height:38px"><img src="../assets/logo/hkust-mark-color.png" style="height:60px"><span class="mono" style="text-align:right">hkust-fullname-color.png<br>hkust-mark-color.png</span></div>
<div style="background:var(--hkust-blue);border-radius:8px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:18px"><img src="../assets/logo/hkust-fullname-white.png" style="height:38px"><img src="../assets/logo/hkust-mark-white.png" style="height:60px"><span class="mono" style="color:var(--on-navy-muted);text-align:right">hkust-fullname-white.png<br>hkust-mark-white.png</span></div></div>
<div style="font-size:12px;color:var(--fg3);margin-top:10px">Full-name lockup 600×145 · mark 184×286 · PNG with transparency. The band uses the white full-name lockup at 34px tall, always on the left.</div></body></html>
