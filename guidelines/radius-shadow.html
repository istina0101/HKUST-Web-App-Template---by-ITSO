<!-- @dsCard group="Effects" viewport="700x150" name="Radius & shadow" subtitle="2 / 4 / 8 px radii and three navy-tinted shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Radius & shadow</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg1);font-family:var(--font-body);color:var(--fg2)}.g{display:grid;gap:10px}.sw{border-radius:var(--r-md);padding:10px;min-height:72px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px;line-height:1.3}.sw b{font-size:12px;font-weight:700}.sw code{font-family:var(--font-mono);font-size:10.5px;opacity:.85}.mono{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}.cap{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}</style></head><body><div style="display:flex;gap:22px;align-items:flex-end">
<div style="text-align:center"><div style="width:72px;height:56px;background:var(--bg-brand-light);border:1px solid var(--border-strong);border-radius:var(--r-sm)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">--r-sm · 2px</div><div style="font-size:11px;color:var(--fg3)">Tag</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--bg-brand-light);border:1px solid var(--border-strong);border-radius:var(--r-md)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">--r-md · 4px</div><div style="font-size:11px;color:var(--fg3)">Buttons, inputs, badges, chips</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--bg-brand-light);border:1px solid var(--border-strong);border-radius:var(--r-lg)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">--r-lg · 8px</div><div style="font-size:11px;color:var(--fg3)">Cards, modals</div></div><div style="text-align:center"><div style="width:72px;height:56px;background:var(--bg-brand-light);border:1px solid var(--border-strong);border-radius:var(--r-pill)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">--r-pill · 999px</div><div style="font-size:11px;color:var(--fg3)">Switch, progress, counts</div></div>
<div style="width:1px;height:80px;background:var(--border);margin:0 6px"></div>
<div style="text-align:center"><div style="width:96px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-sm)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">--shadow-sm</div><div style="font-size:11px;color:var(--fg3)">Switch knob, resting</div></div><div style="text-align:center"><div style="width:96px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-md)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">--shadow-md</div><div style="font-size:11px;color:var(--fg3)">Card hover, tooltip</div></div><div style="text-align:center"><div style="width:96px;height:56px;background:#fff;border-radius:8px;box-shadow:var(--shadow-lg)"></div><div style="font-size:12px;font-weight:700;margin-top:6px">--shadow-lg</div><div style="font-size:11px;color:var(--fg3)">Modal, menu, toast</div></div></div></body></html>
