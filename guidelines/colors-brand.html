<!-- @dsCard group="Colors" viewport="700x110" name="Brand palette" subtitle="HKUST navy + gold, ITSO blue + orange (Dec 2025 brand)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Brand palette</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg1);font-family:var(--font-body);color:var(--fg2)}.g{display:grid;gap:10px}.sw{border-radius:var(--r-md);padding:10px;min-height:72px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px;line-height:1.3}.sw b{font-size:12px;font-weight:700}.sw code{font-family:var(--font-mono);font-size:10.5px;opacity:.85}.mono{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}.cap{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}</style></head><body><div class="g" style="grid-template-columns:repeat(6,1fr)"><div class="sw" style="background:var(--hkust-blue);color:#fff;"><b>HKUST blue</b><code>#003366 · --hkust-blue</code></div><div class="sw" style="background:var(--hkust-gold);color:#fff;"><b>HKUST gold</b><code>#996600 · --hkust-gold</code></div><div class="sw" style="background:var(--hkust-yellow);color:#003366;"><b>HKUST yellow</b><code>#cc9900 · --hkust-yellow</code></div><div class="sw" style="background:var(--itso-blue-dark);color:#fff;"><b>ITSO blue</b><code>#0054a6 · --itso-blue-dark</code></div><div class="sw" style="background:var(--itso-blue-light);color:#003366;"><b>ITSO light blue</b><code>#29abe2 · --itso-blue-light</code></div><div class="sw" style="background:var(--itso-orange);color:#003366;"><b>ITSO orange</b><code>#f7941d · --itso-orange</code></div></div></body></html>
