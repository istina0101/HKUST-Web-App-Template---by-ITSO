<!-- @dsCard group="Effects" viewport="700x130" name="Motion" subtitle="120 / 150 / 200 ms fades with plain ease; hover darkens or lifts 1px, press sinks 1px" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Motion</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg1);font-family:var(--font-body);color:var(--fg2)}.g{display:grid;gap:10px}.sw{border-radius:var(--r-md);padding:10px;min-height:72px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-size:11px;line-height:1.3}.sw b{font-size:12px;font-weight:700}.sw code{font-family:var(--font-mono);font-size:10.5px;opacity:.85}.mono{font-family:var(--font-mono);font-size:11px;color:var(--fg3)}.cap{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg4)}</style></head><body><div style="display:flex;gap:16px;align-items:center;font-size:12px">
<button style="font:inherit;font-weight:700;font-size:14px;padding:9px 16px;border-radius:4px;border:1px solid transparent;background:var(--itso-blue-dark);color:#fff;cursor:pointer;transition:background var(--t-fast)" onmouseenter="this.style.background='var(--hkust-blue)'" onmouseleave="this.style.background='var(--itso-blue-dark)'" onmousedown="this.style.transform='translateY(1px)'" onmouseup="this.style.transform=''">Hover · darken 120ms</button>
<div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:14px 18px;transition:box-shadow var(--t-base),transform var(--t-base),border-color var(--t-base);cursor:pointer" onmouseenter="this.style.boxShadow='var(--shadow-md)';this.style.transform='translateY(-1px)';this.style.borderColor='var(--border-strong)'" onmouseleave="this.style.boxShadow='';this.style.transform='';this.style.borderColor='var(--border)'">Card hover · lift 1px 150ms</div>
<div style="flex:1;display:grid;gap:4px"><div><span class="mono">--t-fast 120ms</span> buttons, chips, inputs, nav rows</div><div><span class="mono">--t-base 150ms</span> cards, switch, step bars</div><div><span class="mono">--t-slow 200ms</span> toast (180ms), sidebar slide-in</div><div style="color:var(--fg3)">No springs, bounces or blur. Toast fades + slides 16px.</div></div></div></body></html>
